<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การบวกของเลขคู่</title>
    <link rel="stylesheet" href="การบวกของเลขคู่.css">
    <script src="การบวกของเลขคู่.js" defer></script>
</head>
<body>
    <header>
        <h1>โปรเเกรมคำนวนผลบวกจำนวนคู่</h1>
        <P>คำนวนผลรวมของเลขคู่โดยเริ่มนับตั้งเเต่ 0 เป็นต้นไป</P>
    </header>

    <main>
        <section class="input-section">
              <label for="numberInput">กรอกจำนวนตัวเลข (n) :</label>
              <input type="number" id="numberInput" min="1" placeholder="เช่น 4">
              <button type="button" id="calculateBtn">คำนวนผลลัพธ์</button>
        </section>

        <section class="result-section">
               <h2>ผลลัพธ์การคำนวน</h2>
               <p id="equationDisplay">รูปเเบบการบวก :</p>
               <p id="resultDisplay">ผลรวมทั้งหมด :</p>
        </section>
    </main>

    <footer>
        <p>แบบฝึกหัดการเขียนโปรแกรมเบื้องต้น JS (บทเรียนเรื่อง function)</p>
    </footer>
</body>
</html>
